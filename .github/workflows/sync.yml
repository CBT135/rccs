name: Trace Spond RCCS

# Heure de Paris :
#   mercredi et vendredi à 15h55, 16h55 et 17h55
#   samedi à 18h00, dimanche à 8h55
# GitHub planifie en UTC : chaque créneau est déclaré pour l'heure d'été (UTC+2)
# et l'heure d'hiver (UTC+1), et l'étape « Créneau » ne garde que le bon.
on:
  schedule:
    - cron: "55 13 * * 3,5"   # mer/ven 15h55 été
    - cron: "55 14 * * 3,5"   # mer/ven 16h55 été | 15h55 hiver
    - cron: "55 15 * * 3,5"   # mer/ven 17h55 été | 16h55 hiver
    - cron: "55 16 * * 3,5"   # mer/ven            17h55 hiver
    - cron: "0 16 * * 6"      # sam 18h00 été
    - cron: "0 17 * * 6"      # sam 18h00 hiver
    - cron: "55 6 * * 0"      # dim 8h55 été
    - cron: "55 7 * * 0"      # dim 8h55 hiver
  workflow_dispatch:
    inputs:
      course:
        description: "Facultatif : parcours Garmin à publier (lien ou numéro). Vide = lecture de Spond."
        required: false
        default: ""
      date:
        description: "Date de la sortie (AAAA-MM-JJ), si un parcours est indiqué"
        required: false
        default: ""
      heure:
        description: "Heure de la sortie (HH:MM)"
        required: false
        default: "18:30"

permissions:
  contents: write

concurrency:
  group: sync-rccs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Créneau (heure d'été / d'hiver)
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        shell: python
        run: |
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          sched = os.environ.get("SCHEDULE", "")
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not sched:                      # lancement manuel
              out.write("run=true\n"); raise SystemExit
          minute, hour = (int(x) for x in sched.split()[:2])
          # Heure de Paris correspondant à ce créneau UTC, au jour prévu (même si GitHub démarre en retard).
          today = dt.datetime.now(dt.timezone.utc).date()
          local = dt.datetime(today.year, today.month, today.day, hour, minute, tzinfo=dt.timezone.utc) \
                    .astimezone(ZoneInfo("Europe/Paris"))
          wanted = {2: {"15:55", "16:55", "17:55"},   # mercredi
                    4: {"15:55", "16:55", "17:55"},   # vendredi
                    5: {"18:00"},                     # samedi
                    6: {"08:55"}}                     # dimanche
          ok = local.strftime("%H:%M") in wanted.get(local.weekday(), set())
          print(f"Créneau {local:%A %H:%M} (Paris) : {'exécution' if ok else 'autre saison, rien à faire'}")
          out.write(f"run={'true' if ok else 'false'}\n")

      - uses: actions/checkout@v7
        if: steps.slot.outputs.run == 'true'

      - uses: actions/setup-python@v7
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Dépendances
        if: steps.slot.outputs.run == 'true'
        run: pip install -r sync/requirements.txt

      - name: Synchro
        if: steps.slot.outputs.run == 'true'
        env:
          SPOND_USERNAME: ${{ secrets.SPOND_USERNAME }}
          SPOND_PASSWORD: ${{ secrets.SPOND_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          FORCE_COURSE_ID: ${{ github.event.inputs.course }}
          FORCE_DATE: ${{ github.event.inputs.date }}
          FORCE_TIME: ${{ github.event.inputs.heure }}
        run: python sync/sync_rccs.py

      - name: Publier la trace
        if: steps.slot.outputs.run == 'true'
        run: |
          git add -A trace
          if git diff --cached --quiet; then echo "Trace inchangée."; exit 0; fi
          name=$(python -c "import json;print(json.load(open('trace/latest.json'))['name'])")
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -m "Trace $name"
          git push
